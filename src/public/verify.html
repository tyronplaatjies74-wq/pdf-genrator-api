<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Verify your email - PDF API</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body style="font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; background-color: #f9fafb;">
  <div style="background: white; padding: 32px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 500px; width: 100%; text-align: center;">
    <h2 id="status" style="margin-top: 0; color: #111827;">Checking your link...</h2>
    <div id="result" style="margin-top: 16px; color: #4b5563; text-align: left;"></div>
    <button id="reveal" type="button" hidden style="margin-top: 16px; padding: 12px 20px; font-size: 16px; border: 0; border-radius: 6px; background: #111827; color: white; cursor: pointer;">Reveal my API key</button>
    <noscript><p>JavaScript is needed to show your API key.</p></noscript>
  </div>
  <script src="/verify.js" defer></script>
</body>
</html>
